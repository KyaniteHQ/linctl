version: "3"

vars:
  BINARY: linctl
  PKG: ./cmd/linctl
  GOLANGCI_LINT: github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
  GORELEASER: github.com/goreleaser/goreleaser/v2@v2.16.0
  # Single source of the upstream Linear SDK pin. CI reads the same file, so a
  # refresh bumps one place instead of two.
  LINEAR_SDK_REF:
    sh: cat "{{.TASKFILE_DIR}}/.linear-sdk-ref"
  INFISICAL_ENV: secrets
  INFISICAL_PATH: /linctl
  # Infisical needs a project id. Export INFISICAL_PROJECT_ID to supply one without
  # committing it to this public repo; leave it unset to fall back to a local .infisical.json.
  INFISICAL_PROJECT_FLAG:
    sh: |
      if [ -n "${INFISICAL_PROJECT_ID:-}" ]; then
        printf '%s %s' --projectId "$INFISICAL_PROJECT_ID"
      fi

tasks:
  default:
    deps: [ci]

  fmt:
    desc: Format Go files
    cmds:
      - find cmd internal scripts -type f -name '*.go' ! -path 'internal/client/internal/gql/generated.go' -print0 | xargs -0 go tool gofumpt -w
      - find cmd internal scripts -type f -name '*.go' ! -path 'internal/client/internal/gql/generated.go' -print0 | xargs -0 go tool goimports -w -local "$(go list -m)"

  fmt-check:
    desc: Verify Go files are gofumpt formatted without modifying them
    cmds:
      - |
        files="$(find cmd internal scripts -type f -name '*.go' ! -path 'internal/client/internal/gql/generated.go' -print0 |
          xargs -0 go tool gofumpt -l)"
        if [[ -n "$files" ]]; then
          printf '%s\n' "$files"
          exit 1
        fi

  deps-check:
    desc: Verify module downloads, checksums, and tidy state without modifying source
    cmds:
      - go mod download
      - go mod verify
      - go mod tidy -diff

  lint:
    desc: Run linters
    cmds:
      - go run {{.GOLANGCI_LINT}} run --timeout 5m $(bash scripts/go-packages.sh)

  vuln:
    desc: Run vulnerability checks
    cmds:
      - go tool govulncheck $(bash scripts/go-packages.sh)

  gen-skill:
    desc: Regenerate the linctl agent command reference from the command tree
    cmds:
      - go run scripts/gen-skill.go

  generated-client-check:
    desc: Regenerate the GraphQL client and verify its package boundary is tracked
    cmds:
      - go generate ./...
      - |
        generated=(
          internal/client/internal/gql/generated.go
          internal/client/internal/gql/exports.go
        )
        for path in "${generated[@]}"; do
          if ! git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
            printf 'generated output is not tracked: %s\n' "$path" >&2
            exit 1
          fi
        done
        if [[ -e internal/client/generated.go ]] ||
          git ls-files --error-unmatch internal/client/generated.go >/dev/null 2>&1; then
          printf 'legacy generated client must be absent and untracked: internal/client/generated.go\n' >&2
          exit 1
        fi
        git diff --exit-code -- "${generated[@]}"

  generate-check:
    desc: Regenerate the GraphQL client and command reference and verify they are committed
    cmds:
      - task: generated-client-check
      - task: gen-skill
      - |
        git diff --exit-code -- \
          skills/linctl/references/commands.md \
          skills/linctl/references/guarded-writes.md
      - go run scripts/linear_api_coverage*.go -h >/dev/null
      - go run scripts/linear_schema_drift_check.go -h >/dev/null
      - task: upstream-schema-checks

  linear-sdk-upstream-checkout:
    desc: Clone or refresh the upstream Linear SDK checkout used by schema and coverage checks
    cmds:
      - |
        upstream="${LINCTL_LINEAR_SDK_UPSTREAM:?set LINCTL_LINEAR_SDK_UPSTREAM to a run-local Linear SDK checkout path}"
        remote="https://github.com/linear/linear.git"
        ref="${LINCTL_LINEAR_SDK_REF:-{{.LINEAR_SDK_REF}}}"
        offline="${LINCTL_LINEAR_SDK_OFFLINE:-}"
        if [[ ! -e "$upstream" ]]; then
          if [[ -n "$offline" ]]; then
            printf 'LINCTL_LINEAR_SDK_OFFLINE=1 set but no checkout exists at %s\n' "$upstream" >&2
            printf 'Set LINCTL_LINEAR_SDK_UPSTREAM to an existing checkout, or unset LINCTL_LINEAR_SDK_OFFLINE to clone.\n' >&2
            exit 1
          fi
          git init -q "$upstream"
          git -C "$upstream" remote add origin "$remote"
          git -C "$upstream" fetch --depth=1 origin "$ref"
          git -C "$upstream" checkout --detach FETCH_HEAD
        elif [[ ! -d "$upstream/.git" ]]; then
          printf 'Linear SDK upstream path exists but is not a git checkout: %s\n' "$upstream" >&2
          printf 'Set LINCTL_LINEAR_SDK_UPSTREAM to a Linear repo checkout or remove the path.\n' >&2
          exit 1
        else
          origin="$(git -C "$upstream" remote get-url origin 2>/dev/null || true)"
          if [[ "$origin" != "$remote" ]]; then
            printf 'Linear SDK upstream checkout has unexpected origin: %s\n' "$origin" >&2
            printf 'Expected %s. Set LINCTL_LINEAR_SDK_UPSTREAM to a Linear repo checkout or remove the path.\n' "$remote" >&2
            exit 1
          fi
          if [[ -n "$offline" ]]; then
            checkout_ref="$ref"
            if ! git -C "$upstream" rev-parse --verify --quiet "$checkout_ref^{commit}" >/dev/null; then
              checkout_ref="origin/$ref"
            fi
            if ! git -C "$upstream" rev-parse --verify --quiet "$checkout_ref^{commit}" >/dev/null; then
              printf 'offline Linear SDK checkout does not contain ref %s\n' "$ref" >&2
              exit 1
            fi
            git -C "$upstream" checkout --detach "$checkout_ref"
            printf 'using existing upstream checkout at %s (LINCTL_LINEAR_SDK_OFFLINE=1)\n' "$ref" >&2
          else
            git -C "$upstream" fetch --depth=1 origin "$ref"
            git -C "$upstream" checkout --detach FETCH_HEAD
          fi
        fi

  upstream-schema-checks:
    desc: Run GraphQL operation and coverage-ledger checks behind one shared upstream checkout
    cmds:
      - bash scripts/upstream-check.sh all

  coverage-ledger-check:
    desc: Verify the generated Linear API coverage ledger against the upstream SDK checkout
    cmds:
      - bash scripts/upstream-check.sh ledger

  schema-drift-check:
    desc: Report semantic drift between the vendored Linear schema and the upstream Linear SDK schema (nightly-only, not part of ci)
    cmds:
      - bash scripts/upstream-check.sh drift

  schema-refresh:
    desc: Sync vendored Linear schema, SDK ref pins, generated client, and coverage ledger from upstream (not part of ci)
    cmds:
      - bash scripts/schema-refresh-from-upstream.sh

  graphql-operation-check:
    desc: Validate local GraphQL operations against the upstream Linear SDK schema
    cmds:
      - bash scripts/upstream-check.sh operations

  domain-language-check:
    desc: Verify user-facing docs and help avoid workspace terminology
    cmds:
      - bash scripts/domain-language-check.sh

  test:
    desc: Run tests
    cmds:
      - go test -race -shuffle=on -count=1 $(bash scripts/go-packages.sh)

  coverage:
    desc: Run statement coverage for hand-written code
    cmds:
      - bash scripts/coverage.sh

  smoke-run:
    desc: Build and smoke-run the CLI help surface
    cmds:
      - |
        bin="./bin/{{.BINARY}}-smoke$(go env GOEXE)"
        go build -o "$bin" {{.PKG}}
        "$bin" --version
        "$bin" --help
        "$bin" usage
        "$bin" issue usage

  live-smoke:
    desc: Run opt-in live smoke tests against disposable Linear resources
    cmds:
      - bash scripts/live-smoke.sh

  live-oauth:
    desc: Verify OAuth client-credentials auth against the pinned Linear target
    cmds:
      - |
        repo="{{.TASKFILE_DIR}}"
        binary="${LINCTL_BINARY:-$repo/bin/{{.BINARY}}}"
        if [[ -z "${LINCTL_BINARY:-}" ]]; then
          (cd "$repo" && go build -trimpath -o "$binary" {{.PKG}})
        fi
        LINCTL_BINARY="$binary" bash "$repo/scripts/live-oauth.sh" "$binary"

  browser-login-smoke:
    desc: Run manual browser OAuth login smoke in isolated auth state
    cmds:
      - bash scripts/browser-login-smoke.sh {{.CLI_ARGS}}

  browser-login-smoke-check:
    desc: Run deterministic non-live browser login smoke harness checks
    cmds:
      - bash scripts/browser-login-smoke.sh --self-test

  # Shared wrapper for the *-infisical aliases: run one task under Infisical
  # secrets from /linctl. TARGET is the task name, TARGET_ARGS its trailing args.
  infisical-run:
    internal: true
    vars:
      TARGET_ARGS: ""
    cmds:
      - |
        infisical run {{.INFISICAL_PROJECT_FLAG}} --env {{.INFISICAL_ENV}} --path {{.INFISICAL_PATH}} -- \
          go tool task \
            --taskfile "{{.TASKFILE_DIR}}/Taskfile.yml" \
            --dir "{{.TASKFILE_DIR}}" \
            {{.TARGET}} {{.TARGET_ARGS}}

  browser-login-smoke-infisical:
    desc: Run browser OAuth login smoke with Infisical secrets from /linctl
    cmds:
      - task: infisical-run
        vars:
          TARGET: browser-login-smoke
          TARGET_ARGS: -- {{.CLI_ARGS}}

  live-oauth-infisical:
    desc: Verify OAuth auth with Infisical secrets from /linctl
    cmds:
      - task: infisical-run
        vars:
          TARGET: live-oauth

  live-smoke-infisical:
    desc: Run live smoke with Infisical secrets from /linctl
    cmds:
      - task: infisical-run
        vars:
          TARGET: live-smoke

  vet:
    desc: Run go vet
    cmds:
      - go vet $(bash scripts/go-packages.sh)

  actionlint:
    desc: Lint GitHub Actions workflows (matches CI; needs shellcheck on PATH for shell checks)
    env:
      SHELLCHECK_OPTS: --exclude=SC2046
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  shellcheck:
    desc: Lint shell scripts
    cmds:
      - shellcheck scripts/*.sh

  build:
    desc: Build linctl
    cmds:
      - go build -trimpath -ldflags="-s -w" -o bin/{{.BINARY}} {{.PKG}}

  goreleaser-check:
    desc: Verify the GoReleaser configuration without publishing
    cmds:
      - go run {{.GORELEASER}} check

  release-preflight:
    desc: Run the non-publishing pre-tag release preflight
    cmds:
      - task: ci
      - task: coverage
      - task: goreleaser-check

  release-snapshot:
    desc: Optionally build a local GoReleaser snapshot without publishing
    cmds:
      - go run {{.GORELEASER}} release --snapshot --clean

  ci:
    desc: Run the local CI gate
    cmds:
      - task: deps-check
      - task: fmt-check
      - task: generate-check
      - task: domain-language-check
      - task: browser-login-smoke-check
      - task: vet
      - task: test
      - go build $(bash scripts/go-packages.sh)
      - task: smoke-run
      - task: lint
      - task: shellcheck
      - task: actionlint
      - task: vuln
