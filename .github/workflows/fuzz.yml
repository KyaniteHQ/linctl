name: fuzz

# The fuzz functions run their seed corpus under the normal test suite; this
# workflow actually fuzzes them on a short budget so they keep finding new
# inputs. A crash uploads the generated corpus so it can be committed under
# testdata/fuzz/<Func>/ as a permanent regression seed.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  discover:
    name: discover fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Discover func Fuzz targets
        id: discover
        run: |
          set -euo pipefail
          matrix="$(python3 - <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          import sys

          output = subprocess.check_output(
              ["git", "grep", "-n", "^func Fuzz", "--", "*_test.go"],
              text=True,
          )
          include = []
          for line in output.splitlines():
              path, _lineno, rest = line.split(":", 2)
              match = re.search(r"func (Fuzz\w+)", rest)
              if match is None:
                  print(f"unparseable fuzz declaration: {line}", file=sys.stderr)
                  sys.exit(1)
              package = "./" + str(pathlib.Path(path).parent)
              include.append({"target": match.group(1), "package": package})
          include.sort(key=lambda item: (item["package"], item["target"]))
          if not include:
              print("no func Fuzz targets found", file=sys.stderr)
              sys.exit(1)
          print(json.dumps({"include": include}, separators=(",", ":")))
          PY
          )"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz / ${{ matrix.target }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
      - name: Fuzz ${{ matrix.target }}
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 60s ${{ matrix.package }}
      - name: Upload crash corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/
          if-no-files-found: ignore
