name: ci

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  generated-client:
    name: generated client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
      - name: Verify generated client
        run: go tool task generated-client-check
      - name: Verify generated command references
        run: |
          go run scripts/gen-skill.go
          git diff --exit-code -- \
            skills/linctl/references/commands.md \
            skills/linctl/references/guarded-writes.md
      - name: Verify GraphQL operations and coverage ledger against upstream Linear
        run: go tool task upstream-schema-checks

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "-race"
          - os: macos-latest
            race: "-race"
          - os: windows-latest
            race: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
      - name: Vet
        run: go vet $(bash scripts/go-packages.sh)
      - name: Test
        run: go test ${{ matrix.race }} -shuffle=on -count=1 -timeout 180s $(bash scripts/go-packages.sh)
      - name: Build
        run: go build $(bash scripts/go-packages.sh)
      - name: Smoke run
        run: |
          bin="./linctl-bin$(go env GOEXE)"
          go build -o "$bin" ./cmd/linctl
          "$bin" --version
          "$bin" --help
          "$bin" usage
          "$bin" issue usage

  test-windows:
    name: test-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
      - name: Test Windows auth lock
        run: go test -shuffle=on -count=1 -timeout 180s ./internal/auth

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
      - name: Verify hand-written coverage
        run: bash scripts/coverage.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: ./cmd/... ./internal/...
      - name: Shellcheck
        run: shellcheck scripts/*.sh
      - name: Domain language
        run: bash scripts/domain-language-check.sh
      - name: Actionlint
        # scripts/go-packages.sh emits a space-separated package list, so the
        # unquoted command substitution in the Go steps is intentional word
        # splitting — SC2046 does not apply here.
        env:
          SHELLCHECK_OPTS: --exclude=SC2046
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
      - name: Vulnerability scan
        # Same pinned reachability-aware scan as the local gate (`task vuln`):
        # go.mod pins govulncheck, and scripts/go-packages.sh scopes the scan to
        # product packages (the scripts/ build-ignored generator and gitignored
        # skill examples break a bare ./...). govulncheck-action was dropped: it
        # installs govulncheck@latest unpinned and its v1.1.0 both collides with
        # this job's module cache and passes multi-pattern go-package as one
        # quoted argument ("no packages matched").
        run: go tool task vuln

  live-oauth:
    name: live oauth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LINCTL_TEST_ORG_ID: ${{ secrets.LINCTL_TEST_ORG_ID }}
      LINCTL_TEST_TEAM_KEY: ${{ secrets.LINCTL_TEST_TEAM_KEY }}
      LINCTL_TEST_TEAM_ID: ${{ secrets.LINCTL_TEST_TEAM_ID }}
      LINCTL_TEST_PROJECT_ID: ${{ secrets.LINCTL_TEST_PROJECT_ID }}
      LINCTL_OAUTH_CLIENT_ID: ${{ secrets.LINCTL_OAUTH_CLIENT_ID }}
      LINCTL_OAUTH_CLIENT_SECRET: ${{ secrets.LINCTL_OAUTH_CLIENT_SECRET }}
      LINCTL_OAUTH_REDIRECT_URI: ${{ secrets.LINCTL_OAUTH_REDIRECT_URI }}
      LINCTL_OAUTH_SCOPES: ${{ secrets.LINCTL_OAUTH_SCOPES }}
      LINCTL_OAUTH_EXPECTED_ACTOR: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
      - name: Detect OAuth fixture
        id: fixture
        run: |
          ready=true
          for name in LINCTL_OAUTH_CLIENT_ID LINCTL_OAUTH_CLIENT_SECRET LINCTL_OAUTH_REDIRECT_URI \
            LINCTL_OAUTH_SCOPES LINCTL_TEST_ORG_ID LINCTL_TEST_TEAM_KEY LINCTL_TEST_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Skip notice (OAuth fixture absent)
        if: steps.fixture.outputs.ready != 'true'
        run: echo "OAuth fixture env is not configured, skipping live OAuth." >> "$GITHUB_STEP_SUMMARY"
      - name: Write live target config
        if: steps.fixture.outputs.ready == 'true'
        run: |
          {
            printf '[target]\n'
            printf 'org_id = "%s"\n' "$LINCTL_TEST_ORG_ID"
            printf 'team_key = "%s"\n' "$LINCTL_TEST_TEAM_KEY"
            printf 'team_id = "%s"\n' "$LINCTL_TEST_TEAM_ID"
            printf 'project_id = "%s"\n' "$LINCTL_TEST_PROJECT_ID"
          } > .linctl.toml
      - name: OAuth live gate
        if: steps.fixture.outputs.ready == 'true'
        run: go tool task live-oauth

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  release-snapshot:
    name: release snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/go-setup
        with:
          verify-dependencies: "false"
      - name: Verify release build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.16.0
          args: release --snapshot --clean --skip=sign,sbom
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
