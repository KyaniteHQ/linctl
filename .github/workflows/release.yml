name: release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  require-ci:
    name: require branch ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful branch CI for tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_SHA: ${{ github.sha }}
        run: |
          ci_url="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch master \
              --commit "$TAG_SHA" \
              --status success \
              --json url \
              --jq '.[0].url // ""' \
              --limit 1
          )"
          if [[ -z "$ci_url" ]]; then
            echo "No successful ci.yml branch run found for tagged commit $TAG_SHA."
            echo "Push the commit to master and wait for the full CI matrix before tagging a release."
            exit 1
          fi
          echo "Found successful branch CI: $ci_url"

  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: require-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/go-setup
        with:
          verify-dependencies: "false"
      - name: GoReleaser check
        run: go tool task goreleaser-check

  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preflight
    permissions:
      contents: write # create the GitHub release and upload archives
      id-token: write # keyless cosign signing + build-provenance OIDC token
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/go-setup
      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew tap push. A classic PAT needs the `repo` scope; a
          # fine-grained PAT needs `contents: write` on KyaniteHQ/homebrew-linctl.
          GH_PAT: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  verify:
    name: verify release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    permissions:
      contents: read
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify published archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p verify
          cd verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "linctl_*_linux_amd64.tar.gz" \
            --pattern "checksums.txt" \
            --pattern "checksums.txt.sigstore.json"
          # Sigstore round-trip: the bundle must verify against checksums.txt and
          # carry the KyaniteHQ/linctl release-workflow identity from GitHub OIDC.
          cosign verify-blob \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp 'https://github.com/KyaniteHQ/linctl/.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            checksums.txt
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf linctl_*_linux_amd64.tar.gz
          ./linctl --version
