query WorkflowStatesByTeam($teamId: ID!, $first: Int) {
  workflowStates(filter: { team: { id: { eq: $teamId } } }, first: $first) {
    nodes {
      id
      name
      type
      position
    }
    pageInfo {
      hasNextPage
    }
  }
}

mutation IssueCreate($input: IssueCreateInput!) {
  issueCreate(input: $input) {
    success
    issue {
      ...IssueSummaryFields
    }
  }
}

mutation IssueUpdate($id: String!, $input: IssueUpdateInput!) {
  issueUpdate(id: $id, input: $input) {
    success
    issue {
      ...IssueSummaryFields
    }
  }
}

mutation IssueCommentCreate($input: CommentCreateInput!) {
  commentCreate(input: $input) {
    success
    comment {
      id
      body
      url
      issue {
        ...IssueSummaryFields
      }
    }
  }
}

mutation IssueClose($id: String!, $input: IssueUpdateInput!) {
  issueUpdate(id: $id, input: $input) {
    success
    issue {
      ...IssueSummaryFields
    }
  }
}

mutation IssueArchive($id: String!, $trash: Boolean) {
  issueArchive(id: $id, trash: $trash) {
    success
    entity {
      ...IssueSummaryFields
    }
  }
}

mutation IssueAddLabel($id: String!, $labelId: String!) {
  issueAddLabel(id: $id, labelId: $labelId) {
