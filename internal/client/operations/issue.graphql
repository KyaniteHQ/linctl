}

query issueFilterSuggestion($prompt: String!, $teamId: String, $projectId: String) {
  issueFilterSuggestion(prompt: $prompt, teamId: $teamId, projectId: $projectId) {
    filter
    logId
  }
}

query issueTitleSuggestionFromCustomerRequest($request: String!) {
  issueTitleSuggestionFromCustomerRequest(request: $request) {
    title
    logId
  }
}

query issue($id: String!) {
  issue(id: $id) {
    description
    ...IssueSummaryFields
    team {
      organization {
        id
      }
    }
    projectMilestone {
      id
      name
    }
  }
}

query issue_comments($id: String!, $first: Int, $after: String, $includeArchived: Boolean) {
  issue(id: $id) {
    id
    identifier
    comments(first: $first, after: $after, includeArchived: $includeArchived) {
      nodes {
        id
        body
        url
        createdAt
        parentId
        user {
          id
          name
          displayName
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

