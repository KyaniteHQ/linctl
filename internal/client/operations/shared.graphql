fragment ProjectSummaryFields on Project {
  id
  name
  description
  slugId
  url
  priority
  status {
    id
    name
    type
  }
  lead {
    id
    name
    displayName
  }
  teams(first: 50) {
    nodes {
      id
      key
      name
    }
    pageInfo {
      hasNextPage
    }
  }
}
