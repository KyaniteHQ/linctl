fragment IssueSummaryFields on Issue {
  id
  identifier
  title
  branchName
  url
  priority
  priorityLabel
  team {
    id
    key
    name
  }
  state {
    id
    name
    type
  }
  assignee {
    id
    name
    displayName
  }
  project {
    id
    name
  }
}

fragment CustomerNeedMetadataFields on CustomerNeed {
  id
  createdAt
  updatedAt
  archivedAt
  priority
  url
  customer {
    id
    name
  }
  issue {
    id
    identifier
    title
  }
  project {
    id
    name
  }
}

fragment IssueSharedAccessFields on IssueSharedAccess {
  isShared
  viewerHasOnlySharedAccess
  sharedWithCount
  disallowedIssueFields
}

fragment IssueAttachmentsProjection on Issue {
  attachments(first: $first, after: $after, includeArchived: $includeArchived) {
    nodes {
      ...AttachmentSummaryFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

fragment IssueBotActorProjection on Issue {
  id
  botActor {
    ...ActorBotSummaryFields
  }
}

fragment IssueChildrenProjection on Issue {
  children(first: $first, after: $after, includeArchived: $includeArchived) {
    nodes {
      ...IssueSummaryFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

