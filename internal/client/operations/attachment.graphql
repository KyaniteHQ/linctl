mutation AttachmentLinkURL($input: AttachmentCreateInput!) {
  attachmentCreate(input: $input) {
    success
    attachment {
      ...AttachmentSummaryFields
    }
  }
}

fragment AttachmentSummaryFields on Attachment {
  id
  title
  subtitle
  url
  sourceType
}
